<div id="overlay"><div id="panel"><h1>던전 심연</h1><div class="desc" id="panelDesc">무작위로 생성된 미궁에 갇혔다.<br><b style="color:#7ef3ff">보석 6개</b>를 모아 <b style="color:#c39bff">탈출 포털</b>을 활성화하라.</div><table><tr><td class="k">화면 왼쪽</td><td>드래그 = 이동</td></tr><tr><td class="k">화면 오른쪽</td><td>드래그 = 시점 회전</td></tr><tr><td class="k">PC</td><td>WASD 이동 · ←→ 회전</td></tr><tr><td class="k">목표</td><td>보석 수집 → 포털 도달</td></tr></table><button id="startBtn">모험 시작</button><button id="againBtn" class="hidden">다시 도전</button><div class="desc" id="resultTxt" style="display:none"></div></div></div>

'use strict';
const TS=64;let MOVE_SPD=3.1,ROT_SPD=2.6;const COLL_R=.22,GEM_TOTAL=6,LOOK_SENS=.0052;const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let IW=320,IH=180,img=null,buf32=null,zbuf=null,vignette=null,planeLen=.74,uiS=1,PIX_BUDGET=85000;const vw_=()=>Math.floor((window.visualViewport||window).width||innerWidth),vh_=()=>Math.floor((window.visualViewport||window).height||innerHeight);
function applyRes(){const cw=Math.max(1,vw_()),ch=Math.max(1,vh_()),aspect=cw/ch;planeLen=aspect>=1?.74:.95;let ih=Math.sqrt(PIX_BUDGET/aspect);ih=Math.min(300,Math.max(120,ih));let iw=Math.round(ih*aspect);iw=Math.min(460,Math.max(120,iw));ih=Math.round(iw/aspect);IW=iw;IH=ih;cv.width=IW;cv.height=IH;img=ctx.createImageData(IW,IH);buf32=new Uint32Array(img.data.buffer);zbuf=new Float32Array(IW);vignette=null;uiS=Math.min(1.35,Math.max(.72,IH/230));ctx.imageSmoothingEnabled=false}addEventListener('resize',applyRes);addEventListener('orientationchange',()=>setTimeout(applyRes,300));function pack(r,g,b,a=255){return((a<<24)|(b<<16)|(g<<8)|r)>>>0}

const texBrick=makeLevels(TS,TS,g=>{g.fillStyle='#232028';g.fillRect(0,0,TS,TS);for(let ry=0;ry<8;ry++)for(let rx=0;rx<4;rx++){const off=(ry%2)*8,x=rx*16-off,y=ry*8,t=R(-14,14)|0;g.fillStyle=`rgb(${118+t},${68+t*.6|0},${54+t*.5|0})`;g.fillRect(x+1,y+1,14,6);g.fillStyle='rgba(255,255,255,.08)';g.fillRect(x+1,y+1,14,1);g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x+1,y+6,14,1)}for(let i=0;i<220;i++){g.fillStyle=Math.random()<.5?'rgba(0,0,0,.14)':'rgba(255,255,255,.05)';g.fillRect(Math.random()*TS|0,Math.random()*TS|0,1,1)}});
const texMoss=makeLevels(TS,TS,g=>{g.fillStyle='#191b20';g.fillRect(0,0,TS,TS);for(let sy=0;sy<4;sy++)for(let sx=0;sx<4;sx++){const t=R(-10,10)|0,v=88+t;g.fillStyle=`rgb(${v},${v+4},${v-6})`;g.fillRect(sx*16+1,sy*16+1,14,14);g.fillStyle='rgba(0,0,0,.3)';g.fillRect(sx*16+1,sy*16+13,14,2);g.fillRect(sx*16+13,sy*16+1,2,14)}for(let i=0;i<26;i++){const x=R(0,TS),y=R(0,TS*.7),r=R(2,6);g.fillStyle=`rgba(${50+R(0,30)|0},${110+R(0,40)|0},60,.5)`;g.beginPath();g.arc(x,y,r,0,7);g.fill()}});
const texDoor=makeLevels(TS,TS,g=>{g.fillStyle='#171310';g.fillRect(0,0,TS,TS);for(let p=0;p<4;p++){const t=R(-8,8)|0;g.fillStyle=`rgb(${104+t},${72+t*.6|0},${44+t*.4|0})`;g.fillRect(p*16+2,2,12,60)}g.fillStyle='#3a3f47';g.fillRect(0,10,TS,6);g.fillRect(0,48,TS,6);g.strokeStyle='#c9a13b';g.lineWidth=3;g.beginPath();g.arc(32,32,6,0,7);g.stroke()});
const texFloor=makeLevels(TS,TS,g=>{g.fillStyle='#101216';g.fillRect(0,0,TS,TS);for(let sy=0;sy<4;sy++)for(let sx=0;sx<2;sx++){const t=R(-8,8)|0,v=46+t;g.fillStyle=`rgb(${v},${v+2},${v+7})`;g.fillRect(sx*32+1,sy*16+1,30,14);g.strokeStyle='rgba(0,0,0,.4)';g.strokeRect(sx*32+.5,sy*16+.5,31,15)}});
const texCeil=makeLevels(TS,TS,g=>{g.fillStyle='#0d0e13';g.fillRect(0,0,TS,TS);g.strokeStyle='rgba(255,255,255,.05)';for(let i=0;i<8;i++){g.beginPath();g.moveTo(i*8,0);g.lineTo(i*8,TS);g.stroke()}});
const sprGem=makeLevels(64,64,g=>{g.beginPath();g.moveTo(32,6);g.lineTo(56,32);g.lineTo(32,58);g.lineTo(8,32);g.closePath();g.fillStyle='#27d7ff';g.fill();g.lineWidth=2;g.strokeStyle='#0a5f85';g.stroke();g.beginPath();g.moveTo(32,6);g.lineTo(44,32);g.lineTo(20,32);g.closePath();g.fillStyle='#bdf6ff';g.fill()});function drawPortal(g,alt){g.fillStyle='#0a0618';g.beginPath();g.ellipse(32,84,24,8,0,0,7);g.fill();g.fillStyle=alt?'#5a2fd8':'#6a3cff';g.beginPath();g.ellipse(32,38,22,30,0,0,7);g.fill();g.fillStyle=alt?'#8f6cf5':'#a98cff';g.beginPath();g.ellipse(32,38,16,24,0,0,7);g.fill();g.fillStyle='#150a33';g.beginPath();g.ellipse(32,38,10,17,0,0,7);g.fill()}const sprPortalA=makeLevels(64,96,g=>drawPortal(g,false)),sprPortalB=makeLevels(64,96,g=>drawPortal(g,true));function drawTorch(g,alt){g.fillStyle='#4a3018';g.fillRect(29,46,6,38);g.fillStyle='#ff8c1a';g.beginPath();g.ellipse(32,alt?34:36,10,alt?15:13,alt?.25:-.2,0,7);g.fill();g.fillStyle='#ffc93a';g.beginPath();g.ellipse(32,alt?33:35,6,9,0,0,7);g.fill()}const sprTorchA=makeLevels(64,96,g=>drawTorch(g,false)),sprTorchB=makeLevels(64,96,g=>drawTorch(g,true));
const MW=25,MH=25;let grid,styleG,visited,gems,portal,torches,startPos,startAng;const idx=(x,y)=>y*MW+x;function solid(x,y){x|=0;y|=0;if(x<0||y<0||x>=MW||y>=MH)return true;return grid[y*MW+x]===1}function genMap(){grid=new Uint8Array(MW*MH).fill(1);styleG=new Uint8Array(MW*MH);const st=[[1,1]];grid[idx(1,1)]=0;while(st.length){const[cx,cy]=st[st.length-1],dirs=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-.5);let moved=false;for(const[dx,dy]of dirs){const nx=cx+dx,ny=cy+dy;if(nx>0&&ny>0&&nx<MW-1&&ny<MH-1&&grid[idx(nx,ny)]===1){grid[idx(cx+dx/2,cy+dy/2)]=0;grid[idx(nx,ny)]=0;st.push([nx,ny]);moved=true;break}}if(!moved)st.pop()}for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){if(grid[idx(x,y)]!==1)continue;const h=!grid[idx(x-1,y)]&&!grid[idx(x+1,y)],v=!grid[idx(x,y-1)]&&!grid[idx(x,y+1)];if((h^v)&&Math.random()<.13)grid[idx(x,y)]=0}for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){if(x===0||y===0||x===MW-1||y===MH-1)grid[idx(x,y)]=1;if(grid[idx(x,y)]===1){const r=Math.random();styleG[idx(x,y)]=r<.16?1:r<.24?2:0}}const open=[];for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++)if(grid[idx(x,y)]===0)open.push([x,y]);const dist=new Int16Array(MW*MH).fill(-1),q=[[1,1]];dist[idx(1,1)]=0;while(q.length){const[cx,cy]=q.shift(),d=dist[idx(cx,cy)];for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(grid[idx(nx,ny)]===0&&dist[idx(nx,ny)]<0){dist[idx(nx,ny)]=d+1;q.push([nx,ny])}}}const sorted=[...open].sort((a,b)=>dist[idx(b[0],b[1])]-dist[idx(a[0],a[1])]);portal={x:sorted[0][0]+.5,y:sorted[0][1]+.5};const taken=[sorted[0]];gems=[];for(const c of sorted){if(gems.length>=GEM_TOTAL)break;if(c===sorted[0])continue;if(taken.every(t=>Math.abs(t[0]-c[0])+Math.abs(t[1]-c[1])>=6)){gems.push({x:c[0]+.5,y:c[1]+.5,got:false,phase:Math.random()*7});taken.push(c)}}while(gems.length<GEM_TOTAL){const c=sorted[gems.length+1]||sorted[1];gems.push({x:c[0]+.5,y:c[1]+.5,got:false,phase:Math.random()*7})}torches=[];for(const[x,y]of open){if(Math.random()>.09||torches.length>=14)contin let px=1.5,py=1.5,ang=0,bobPhase=0,bobAmt=0,lastStepPh=0,gotCount=0,gameState='title',startTime=0,clearTime=0,msgQueue=[];const keys=new Set(),joyVec={f:0,s:0},joyBase=document.getElementById('joyBase'),joyKnob=document.getElementById('joyKnob'),RJ=64,activeT=new Map();function showJoy(i){joyBase.style.display='block';joyBase.style.left=i.sx-RJ+'px';joyBase.style.top=i.sy-RJ+'px';joyKnob.style.transform='translate(0,0)'}function updateJoy(i){let dx=i.x-i.sx,dy=i.y-i.sy;const max=RJ*.58,d=Math.hypot(dx,dy);if(d>max){dx*=max/d;dy*=max/d}joyKnob.style.transform=`translate(${dx}px,${dy}px)`;const dd=Math.hypot(dx,dy);if(dd<9){joyVec.f=0;joyVec.s=0}else{joyVec.f=-dy/max;joyVec.s=dx/max}}function hideJoy(){joyBase.style.display='none';joyVec.f=0;joyVec.s=0}
cv.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches){let side=t.clientX<vw_()*.45?'move':'look';activeT.set(t.identifier,{side,sx:t.clientX,sy:t.clientY,x:t.clientX,y:t.clientY});if(side==='move')showJoy(activeT.get(t.identifier))}},{passive:false});cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){const i=activeT.get(t.identifier);if(!i)continue;const dx=t.clientX-i.x;i.x=t.clientX;i.y=t.clientY;if(i.side==='look')ang+=dx*LOOK_SENS;else updateJoy(i)}},{passive:false});function endTouch(e){e.preventDefault();for(const t of e.changedTouches){const i=activeT.get(t.identifier);if(i?.side==='move')hideJoy();activeT.delete(t.identifier)}}cv.addEventListener('touchend',endTouch,{passive:false});cv.addEventListener('touchcancel',endTouch,{passive:false});addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys.add(e.code)});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>{keys.clear();hideJoy()});
function pushMsg(txt){msgQueue.push({txt,until:performance.now()+2800});if(msgQueue.length>4)msgQueue.shift()}function reset(){genMap();px=startPos.x;py=startPos.y;ang=startAng;bobPhase=0;bobAmt=0;gotCount=0;msgQueue=[];hideJoy()}document.getElementById('startBtn').onclick=()=>{reset();gameState='play';startTime=performance.now();document.getElementById('overlay').classList.add('hidden')};document.getElementById('againBtn').onclick=()=>{reset();gameState='play';startTime=performance.now();document.getElementById('againBtn').classList.add('hidden');document.getElementById('resultTxt').style.display='none';document.querySelector('#panelDesc').style.display='';document.getElementById('overlay').classList.add('hidden')};function showResult(){document.getElementById('overlay').classList.remove('hidden');document.querySelector('#panelDesc').style.display='none';document.getElementById('startBtn').classList.add('hidden');document.getElementById('againBtn').classList.remove('hidden');const rt=document.getElementById('resultTxt');rt.style.display='';const m=clearTime/60|0,s=clearTime%60|0;rt.innerHTML=`탈출 성공<br>소요 시간 ${m}:${String(s).padStart(2,'0')} · 보석 ${gotCount}/${GEM_TOTAL}`}
function update(dt,now){if(keys.has('ArrowLeft'))ang-=ROT_SPD*dt;if(keys.has('ArrowRight'))ang+=ROT_SPD*dt;const dirX=Math.cos(ang),dirY=Math.sin(ang),plX=-Math.sin(ang)*planeLen,plY=Math.cos(ang)*planeLen;let mvF=((keys.has('KeyW')||keys.has('ArrowUp'))?1:0)-((keys.has('KeyS')||keys.has('ArrowDown'))?1:0)+joyVec.f,mvS=(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0)+joyVec.s;const len=Math.hypot(mvF,mvS);if(len>1){mvF/=len;mvS/=len}const vx=(dirX*mvF+(plX/planeLen)*mvS)*MOVE_SPD*dt,vy=(dirY*mvF+(plY/planeLen)*mvS)*MOVE_SPD*dt;const free=(x,y)=>!(solid(x-COLL_R,y-COLL_R)||solid(x+COLL_R,y-COLL_R)||solid(x-COLL_R,y+COLL_R)||solid(x+COLL_R,y+COLL_R));if(free(px+vx,py))px+=vx;if(free(px,py+vy))py+=vy;if(len>.08){bobPhase+=dt*9.5*Math.min(1,len);bobAmt=Math.min(1,bobAmt+dt*6)}else bobAmt=Math.max(0,bobAmt-dt*6);const cx=px|0,cy=py|0;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++)if(dx*dx+dy*dy<=8){const gx=cx+dx,gy=cy+dy;if(gx>=0&&gy>=0&&gx<MW&&gy<MH)visited[gx+gy*MW]=1}for(const gm of gems){if(!gm.got&&(px-gm.x)**2+(py-gm.y)**2<.42*.42){gm.got=true;gotCount++;pushMsg(`보석 획득! (${gotCount}/${GEM_TOTAL})`);if(gotCount===GEM_TOTAL)pushMsg('포털이 활성화되었다!')}}const pd=Math.hypot(px-portal.x,py-portal.y);if(pd<.8){if(gotCount>=GEM_TOTAL){gameState='win';clearTime=(now-startTime)/1000;showResult()}else if(!update.lw||now-update.lw>2500){update.lw=now;pushMsg(`포털 잠김 — 남은 보석 ${GEM_TOTAL-gotCount}개`)}}}
function fogLv(d,flick){const f=1-d/(9*flick);return f<=0?0:Math.min(15,(f*16)|0)}function render(now){const t=now*.001,flick=.94+.05*Math.sin(t*9)+.03*Math.sin(t*23+1.7),hz=IH/2+Math.sin(bobPhase)*3.2*bobAmt|0,dirX=Math.cos(ang),dirY=Math.sin(ang),plX=-Math.sin(ang)*planeLen,plY=Math.cos(ang)*planeLen,rd0x=dirX-plX,rd0y=dirY-plY,rd1x=dirX+plX,rd1y=dirY+plY,posZ=.5*IH;for(let y=0;y<IH;y++){const p=y-hz;if(p===0){for(let x=0;x<IW;x++)buf32[y*IW+x]=pack(0,0,0);continue}const rowDist=posZ/p,lv=fogLv(Math.abs(rowDist),flick),tl=(p>0?texFloor:texCeil).levels[lv];let fx=px+rowDist*rd0x,fy=py+rowDist*rd0y;const sx=rowDist*(rd1x-rd0x)/IW,sy=rowDist*(rd1y-rd0y)/IW;let o=y*IW;for(let x=0;x<IW;x++){const tx=((fx-(fx|0))*TS)|0,ty=((fy-(fy|0))*TS)|0;buf32[o++]=tl[((ty&63)<<6)+(tx&63)];fx+=sx;fy+=sy}}for(let x=0;x<IW;x++){const camX=2*x/IW-1,rdx=dirX+plX*camX,rdy=dirY+plY*camX;let mx=px|0,my=py|0,ddx=Math.abs(1/rdx),ddy=Math.abs(1/rdy),stX,stY,sdx,sdy;if(rdx<0){stX=-1;sdx=(px-mx)*ddx}else{stX=1;sdx=(mx+1-px)*ddx}if(rdy<0){stY=-1;sdy=(py-my)*ddy}else{stY=1;sdy=(my+1-py)*ddy}let side=0,hit=false,guard=0;while(!hit&&guard++<64){if(sdx<sdy){sdx+=ddx;mx+=stX;side=0}else{sdy+=ddy;my+=stY;side=1}hit=solid(mx,my)}let perp=side===0?sdx-ddx:sdy-ddy;if(perp<.01)perp=.01;zbuf[x]=perp;let wallX=side===0?py+perp*rdy:px+perp*rdx;wallX-=Math.floor(wallX);let tx=wallX*TS|0;if((side===0&&rdx>0)||(side===1&&rdy<0))tx=TS-1-tx;const lineH=IH/perp|0;let y0=hz-(lineH>>1),y1=y0+lineH,step=TS/lineH,tp=y0<0?-y0*step:0;if(y0<0)y0=0;if(y1>IH)y1=IH;let lv=fogLv(perp,flick);if(side===1)lv=Math.max(0,lv-3);const tl=[texBrick,texMoss,texDoor][styleG[mx+my*MW]||0].levels[Math.min(15,lv)];for(let y=y0;y<y1;y++){const ty=Math.min(TS-1,tp|0);tp+=step;buf32[y*IW+x]=tl[(ty<<6)+tx]}}const list=[],invDet=1/(plX*dirY-dirX*plY);function addSpr(x,y,tex,o={}){const rx=x-px,ry=y-py,trX=invDet*(dirY*rx-dirX*ry),trY=invDet*(-plY*rx+plX*ry);if(trY>.1)list.push({trX,trY,tex,z:o.z||0,hW:o.hW||.8,glow:!!o.glow,seed:o.seed||0})}for(const gm of gems)if(!gm.got)addSpr(gm.x,gm.y,sprGem,{z:.28+.07*Math.sin(t*3+gm.phase),hW:.42,glow:true});addSpr(portal.x,portal.y,(now/300|0)%2?sprPortalB:sprPortalA,{z:0,hW:.95,glow:true});for(const tc of torches)addSpr(tc.x,tc.y,(now/130+tc.seed*7|0)%2?sprTorchB:sprTorchA,{z:.42,hW:.62,glow:true});list.sort((a,b)=>b.trY-a.trY);for(const s of list){const scrX=IW/2*(1+s.trX/s.trY),pixH=s.hW*IH/s.trY,pixW=pixH*(s.tex.tw/s.tex.th),bottom=hz+IH/(2*s.trY)-s.z*IH/s.trY,top=bottom-pixH,x0=Math.max(0,Math.ceil(scrX-pixW/2)),x1=Math.min(IW-1,Math.floor(scrX+pixW/2)),y0=Math.max(0,Math.ceil(top)),y1=Math.min(IH-1,Math.floor(bottom));let lv=fogLv(s.trY,flick);if(s.glow)lv=Math.min(15,lv+8);const tl=s.tex.levels[lv],tw=s.tex.tw,th=s.tex.th;for(let x=x0;x<=x1;x++){if(s.trY>=zbuf[x])continue;const tx=Math.min(tw-1,((x-(scrX-pixW/2))/pixW*tw)|0);for(let y=y0;y<=y1;y++){const ty=Math.min(th-1,((y-top)/pixH*th)|0),c=tl[ty*tw+tx];if((c>>>24)>140)buf32[y*IW+x]=c}}}ctx.putImageData(img,0,0);if(!vignette){vignette=ctx.createRadialGradient(IW/2,IH/2,IH*.35,IW/2,IH/2,IW*.62);vignette.addColorStop(0,'rgba(0,0,0,0)');vignette.addColorStop(1,'rgba(0,0,0,.55)')}ctx.fillStyle=vignette;ctx.fillRect(0,0,IW,IH);ctx.fillStyle='rgba(255,255,255,.45)';ctx.fillRect(IW/2-1,hz-1,2,2);ctx.textAlign='left';ctx.textBaseline='top';ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(6,6,124*uiS,42*uiS);ctx.font=`bold ${Math.round(15*uiS)}px monospace`;ctx.fillStyle='#7ef3ff';ctx.fillText(`보석 ${gotCount}/${GEM_TOTAL}`,14*uiS+6,11*uiS+5);msgQueue=msgQueue.filter(m=>m.until>now);msgQueue.slice(-3).forEach((m,i,a)=>{ctx.font=`bold ${Math.round(12*uiS)}px monospace`;ctx.fillStyle='rgba(255,215,106,.95)';ctx.fillText(m.txt,12*uiS+4,IH-20*uiS-(a.length-1-i)*17*uiS)})}
applyRes();genMap();px=startPos.x;py=startPos.y;ang=startAng;let last=performance.now(),smoothDt=16,qCool=0;function loop(now){const dtms=Math.min(50,now-last);last=now;const dt=dtms/1000;smoothDt=smoothDt*.94+dtms*.06;if(gameState==='play'&&smoothDt>26&&now>qCool&&IW>240){PIX_BUDGET*=.78;applyRes();smoothDt=16;qCool=now+2000}if(gameState==='play')update(dt,now);render(now);requestAnimationFrame(loop)}requestAnimationFrame(loop);
